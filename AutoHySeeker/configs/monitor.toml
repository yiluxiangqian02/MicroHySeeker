# 监控配置（L1 规则引擎 + L2 心跳巡检）
#
# 参考: docs/PLAN_PHASE1_EXPERIMENT_LOOP.md（第 7 节配置结构）

[realtime_monitor]
# L1 规则引擎：默认启用（代码级规则），通常不建议关闭
enabled = true

# 轮询间隔（秒）
poll_interval_s = 2

[realtime_monitor.rules]
# 泵转速偏差阈值（百分比）
pump_speed_deviation_pct = 5.0

# 通信超时阈值（秒）
communication_timeout_s = 3.0

# 步骤超时倍数（例如 2.0 表示超过预期 2 倍时间则告警）
step_timeout_multiplier = 2.0

# 电流突变阈值（百分比）
current_spike_pct = 50.0

[heartbeat_inspector]
# L2 心跳巡检：默认关闭（需要 LLM 综合判断）
enabled = false

# 心跳间隔（秒）
interval_s = 30
