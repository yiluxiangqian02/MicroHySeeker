# AutoHySeeker knowledge-base configuration.
#
# OpenViking is started during AHS backend startup when enabled=true.
# If initialization fails, AHS keeps running and falls back to local workspace
# search / in-memory records for knowledge APIs.

[openviking]
enabled = true
workspace_path = "${VIKING_WORKSPACE:-./OpenViking}"
default_top_k = 5
read_level = "overview"
