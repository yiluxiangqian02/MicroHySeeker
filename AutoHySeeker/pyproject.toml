[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "autohyseeker"
version = "0.1.0"
description = "AutoHySeeker multi-agent backend scaffold"
readme = "README_DEV.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "optuna>=3.6",
]

[project.scripts]
autohyseeker-api = "src.api.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["pytest-cache-files-*", ".venv", "data", "logs"]
addopts = "-p no:cacheprovider"

[tool.hatch.build.targets.wheel]
packages = ["src"]
