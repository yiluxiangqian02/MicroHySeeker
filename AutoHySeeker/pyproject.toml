[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "autohyseeker"
version = "0.1.0"
description = "AutoHySeeker multi-agent backend scaffold"
readme = "README_DEV.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "optuna>=3.5",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "psutil>=5.9",
    "pdfplumber>=0.10.0",
    "readabilipy>=0.2.0",
    "markdownify>=0.11.0",
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.0.0",
    "ebooklib>=0.18.0",
    "json-repair>=0.25.0",
    "apscheduler>=3.11.0",
    "volcengine>=1.0.216",
    "volcengine-python-sdk[ark]>=5.0.3",
    "tabulate>=0.9.0",
    "protobuf>=6.33.5",
    "pdfminer-six>=20251230",
    "typer>=0.12.0",
    "litellm>=1.0.0",
    "python-multipart>=0.0.22",
]

[project.scripts]
autohyseeker-api = "src.api.main:main"
autohyseeker-optimize = "src.run_optimization:main"

[project.optional-dependencies]
rag = ["openviking>=0.1"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["pytest-cache-files-*", ".venv", "data", "logs"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]
