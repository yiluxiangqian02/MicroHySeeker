# Rule precedence notes (implemented in clean_single_mineru_paper.py):
# 1) heading direct_rules / score classification
# 2) paragraph-level section recovery reroute:
#    - front_matter_detector -> S00
#    - abstract_leading_detector -> S01
#    - conclusion_start_detector -> S06
#    - back_matter_detector -> S07
# 3) section_recovery_hints from content_list_v2 (+ layout.json availability) are only auxiliary signals.

order:
  - S00_front_matter
  - S01_abstract
  - S02_introduction
  - S03_methods_and_setup
  - S04_results
  - S05_discussion_mechanism
  - S06_conclusion
  - S07_back_matter_or_supplementary

